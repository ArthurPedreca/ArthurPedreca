name: Rebuild status

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['config.mjs', 'scripts/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: status
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "status-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data README.md
          git diff --cached --quiet || git commit -m "status: rebuild"
          git push
